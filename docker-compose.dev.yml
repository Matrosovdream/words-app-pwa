services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: words-backend-dev
    volumes:
      - ./backend:/app
      - go-mod-cache:/go/pkg/mod
    ports:
      - "18080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: words-frontend-dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:5173"
    environment:
      - VITE_API_TARGET=http://backend:8080
    depends_on:
      - backend

volumes:
  go-mod-cache:
